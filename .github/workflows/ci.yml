name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: Check that the native catalog matches the typings
        run: npm run build:natives -- --check
      - name: Check that the NUI file types match the mime package
        run: npm run build:mime -- --check
      - name: Build the command line tool
        run: npm run build
      - name: Check that the command line tool runs
        run: |
          version=$(node -p "require('./package.json').version")
          test "$(node dist/fiverunner.js --version)" = "$version"
      - name: Run the tests of the example with the package as npm packs it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd examples/bank
          npx --yes --package "$RUNNER_TEMP"/fiverunner-*.tgz fiverunner test
      - name: Check that the package as npm packs it serves the dev UI
        run: |
          cd examples/bank
          npx --yes --package "$RUNNER_TEMP"/fiverunner-*.tgz fiverunner dev --port 30120 > "$RUNNER_TEMP/dev.log" 2>&1 &
          for attempt in $(seq 1 60); do
            grep -q 'FiveRunner runs' "$RUNNER_TEMP/dev.log" && break
            sleep 1
          done
          cat "$RUNNER_TEMP/dev.log"
          port=$(grep -o 'localhost:[0-9]*' "$RUNNER_TEMP/dev.log" | cut -d: -f2)
          curl -sf -H "Host: fiverunner.localhost:$port" "http://127.0.0.1:$port/" | grep -q '<title>FiveRunner</title>'
          curl -sf -H "Host: bank.c1.tab.fiverunner.localhost:$port" "http://127.0.0.1:$port/__fiverunner/sw.js" > /dev/null

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Dev UI in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e

  wasm:
    name: Reproduce cfxlua.wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMSDK_VERSION: 6.0.10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Emscripten
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - run: npm run build:wasm
      - name: Check that the committed module matches the build
        run: git diff --exit-code -- src/core/lua/cfxlua.wasm
